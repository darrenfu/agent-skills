<!--
  Visualize Skill — Infrastructure Boilerplate
  Copy this into every visualization. It handles plumbing:
  hamburger menu (dark/light toggle, print, fullscreen), print styles,
  reduced-motion, theme persistence, keyboard shortcut (Escape to close).
  Style the menu colors via CSS custom properties to match your design.
-->

<!-- Hamburger menu -->
<nav class="viz-menu" id="vizMenu" aria-label="Visualization controls">
    <button class="viz-menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="5" x2="15" y2="5"/>
            <line x1="3" y1="9" x2="15" y2="9"/>
            <line x1="3" y1="13" x2="15" y2="13"/>
        </svg>
    </button>
    <div class="viz-menu-panel" id="vizMenuPanel">
        <button onclick="toggleTheme()" class="viz-menu-item">
            <span class="viz-menu-icon" id="themeIcon">◐</span>
            <span id="themeLabel">Toggle dark mode</span>
        </button>
        <button onclick="window.print()" class="viz-menu-item">
            <span class="viz-menu-icon">⎙</span>
            <span>Print / Save as PDF</span>
        </button>
        <button onclick="toggleFullscreen()" class="viz-menu-item">
            <span class="viz-menu-icon" id="fsIcon">⛶</span>
            <span id="fsLabel">Fullscreen</span>
        </button>
        <hr style="border:none;border-top:1px solid var(--border,#e2e8f0);margin:2px 8px">
        <button onclick="saveAsImage()" class="viz-menu-item" id="saveImgBtn">
            <span class="viz-menu-icon">📷</span>
            <span>Save as image</span>
        </button>
    </div>
</nav>
<style>
/* === INFRASTRUCTURE STYLES — customize colors via CSS custom properties === */

.viz-menu {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 10000;
    font-family: inherit;
}

.viz-menu-toggle {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border, #e2e8f0);
    background: var(--surface, #fff);
    color: var(--text-secondary, #64748b);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.viz-menu-toggle:hover {
    background: var(--surface-hover, #f8fafc);
    border-color: var(--border-strong, #cbd5e1);
    transform: scale(1.05);
}

.viz-menu-panel {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 200px;
    background: var(--surface, #fff);
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 10px;
    padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(-4px) scale(0.97);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
}
.viz-menu.open .viz-menu-panel {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.viz-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 12px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text-primary, #0f172a);
    font-size: 0.85rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.1s;
    font-family: inherit;
}
.viz-menu-item:hover {
    background: var(--surface-hover, #f1f5f9);
}

.viz-menu-icon {
    width: 20px;
    text-align: center;
    font-size: 1rem;
    flex-shrink: 0;
}

/* === Scroll-triggered reveal animations === */
[data-animate] {
    opacity: 0;
    transition-property: opacity, transform, filter;
    transition-duration: 0.6s;
    transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
}
[data-animate="fade-up"] { transform: translateY(20px); }
[data-animate="fade-down"] { transform: translateY(-20px); }
[data-animate="fade-left"] { transform: translateX(-20px); }
[data-animate="fade-right"] { transform: translateX(20px); }
[data-animate="scale-up"] { transform: scale(0.95); }
[data-animate="blur-in"] { filter: blur(8px); }

[data-animate].is-visible {
    opacity: 1;
    transform: none;
    filter: none;
}

/* Print styles */
@media print {
    .viz-menu { display: none !important; }
    body { background: white !important; color: black !important; }
    .dark-mode { all: unset; }
    .card, .section, section { break-inside: avoid; }
    .animate-in { opacity: 1 !important; animation: none !important; }
    [data-animate] { opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; }
    @page { margin: 1.5cm; }
}

/* Respect reduced motion preferences */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    [data-animate] {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
        transition: none !important;
    }
}
</style>

<script>
// Menu toggle
function toggleMenu() {
    const menu = document.getElementById('vizMenu');
    const toggle = menu.querySelector('.viz-menu-toggle');
    const isOpen = menu.classList.toggle('open');
    toggle.setAttribute('aria-expanded', isOpen);
}

// Close menu on outside click or Escape
document.addEventListener('click', function(e) {
    const menu = document.getElementById('vizMenu');
    if (menu && !menu.contains(e.target)) menu.classList.remove('open');
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        const menu = document.getElementById('vizMenu');
        if (menu) menu.classList.remove('open');
    }
});

// Theme toggle with persistence
function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('visualize-dark-mode', isDark);
    updateThemeLabel();
}
function updateThemeLabel() {
    const isDark = document.body.classList.contains('dark-mode');
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if (icon) icon.textContent = isDark ? '☀' : '◐';
    if (label) label.textContent = isDark ? 'Light mode' : 'Dark mode';
}

// Auto-apply saved theme or system preference
if (localStorage.getItem('visualize-dark-mode') === 'true' ||
    (!localStorage.getItem('visualize-dark-mode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.body.classList.add('dark-mode');
}
updateThemeLabel();

// Fullscreen toggle
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}
document.addEventListener('fullscreenchange', function() {
    const icon = document.getElementById('fsIcon');
    const label = document.getElementById('fsLabel');
    const isFs = !!document.fullscreenElement;
    if (icon) icon.textContent = isFs ? '⛶' : '⛶';
    if (label) label.textContent = isFs ? 'Exit fullscreen' : 'Fullscreen';
});

// Scroll-triggered reveal animations
(function initScrollReveal() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelectorAll('[data-animate]').forEach(function(el) {
            el.classList.add('is-visible');
        });
        return;
    }
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                var el = entry.target;
                var delay = parseInt(el.getAttribute('data-delay') || '0', 10);
                var duration = el.getAttribute('data-duration');
                if (duration) el.style.transitionDuration = duration + 'ms';
                if (delay > 0) {
                    setTimeout(function() { el.classList.add('is-visible'); }, delay);
                } else {
                    el.classList.add('is-visible');
                }
                observer.unobserve(el);
            }
        });
    }, { threshold: 0.15 });
    document.querySelectorAll('[data-animate]').forEach(function(el) {
        observer.observe(el);
    });
})();

// Slide deck hash navigation (auto-detected)
// If the page has .slide elements, sync the URL hash with the current slide number.
// Supports: #3 to jump to slide 3 on load, hash updates on navigation,
// and hashchange events for manual URL edits.
// Uses MutationObserver to detect slide changes — works regardless of how
// navigation is triggered (onclick, keyboard closure, or window.goSlide).
(function initSlideHash() {
    var slides = document.querySelectorAll('.slide');
    if (slides.length < 2) return; // Not a slide deck

    // Track active slide and sync hash via MutationObserver
    var lastHash = '';
    function syncHash() {
        for (var i = 0; i < slides.length; i++) {
            if (slides[i].classList.contains('active')) {
                var h = '#' + (i + 1);
                if (h !== lastHash) {
                    lastHash = h;
                    history.replaceState(null, '', h);
                }
                return;
            }
        }
    }
    var observer = new MutationObserver(syncHash);
    for (var i = 0; i < slides.length; i++) {
        observer.observe(slides[i], { attributes: true, attributeFilter: ['class'] });
    }

    // goToSlide: jump directly to slide n (0-indexed)
    window.goToSlide = function(n) {
        if (n < 0 || n >= slides.length) return;
        var active = document.querySelector('.slide.active');
        if (active) active.classList.remove('active');
        slides[n].classList.add('active');
        // Update counter/progress if present
        var cur = document.getElementById('current');
        var total = document.getElementById('total');
        var progress = document.getElementById('progress');
        if (cur) cur.textContent = n + 1;
        if (total) total.textContent = slides.length;
        if (progress) progress.style.width = ((n + 1) / slides.length * 100) + '%';
        var prevBtn = document.querySelector('.nav-prev');
        var nextBtn = document.querySelector('.nav-next');
        if (prevBtn) prevBtn.disabled = n === 0;
        if (nextBtn) nextBtn.disabled = n === slides.length - 1;
    };

    // Listen for manual hash changes
    window.addEventListener('hashchange', function() {
        var n = parseInt(location.hash.replace('#', ''), 10);
        if (n >= 1 && n <= slides.length) window.goToSlide(n - 1);
    });

    // On initial load, jump to hash slide if specified
    var startHash = parseInt(location.hash.replace('#', ''), 10);
    if (startHash >= 1 && startHash <= slides.length) {
        var active = document.querySelector('.slide.active');
        if (active) active.classList.remove('active');
        slides[startHash - 1].classList.add('active');
        // Defer hash write to avoid interfering with page load
        setTimeout(function() {
            history.replaceState(null, '', '#' + startHash);
            var cur = document.getElementById('current');
            var progress = document.getElementById('progress');
            if (cur) cur.textContent = startHash;
            if (progress) progress.style.width = (startHash / slides.length * 100) + '%';
            var prevBtn = document.querySelector('.nav-prev');
            var nextBtn = document.querySelector('.nav-next');
            if (prevBtn) prevBtn.disabled = startHash === 1;
            if (nextBtn) nextBtn.disabled = startHash === slides.length;
        }, 0);
    }
})();

// Lazy-load html2canvas on first use (avoids unconditional 140KB CDN request)
function loadHtml2Canvas() {
    if (typeof html2canvas !== 'undefined') return Promise.resolve();
    return new Promise(function(resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.integrity = 'sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H';
        script.crossOrigin = 'anonymous';
        script.onload = resolve;
        script.onerror = function() { reject(new Error('html2canvas load failed')); };
        document.head.appendChild(script);
    });
}

// Save as image (full page screenshot via html2canvas)
//
// Known html2canvas limitations this function works around:
// 1. body::before pseudo-elements (gradient backgrounds) — capture .container instead
// 2. position:fixed elements — captured at wrong position, so capture .container
// 3. CSS animations with opacity:0 start state — force all to end state before capture
// 4. Google Fonts loading — wait for document.fonts.ready before capture
// 5. Canvas size limits — cap scale at 2x for reasonable output size
// 6. Tainted canvas in iframe contexts (Pixelcloud) — allowTaint must be false so
//    toDataURL() doesn't throw SecurityError; resources failing CORS are simply omitted
// 7. Data URL size limits — use toBlob + createObjectURL instead of toDataURL
// 8. Modern CSS color() function — Chrome 111+ returns color(srgb ...) in computed
//    styles, which html2canvas 1.4.1 can't parse. Strip in onclone before rendering.
function saveAsImage() {
    var btn = document.getElementById('saveImgBtn');
    var label = btn.querySelector('span:last-child');
    var origText = label.textContent;
    label.textContent = 'Loading...';
    btn.style.pointerEvents = 'none';

    loadHtml2Canvas().then(function() {
        label.textContent = 'Capturing...';
        doCapture(btn, label, origText);
    }).catch(function(err) {
        console.error('Failed to load html2canvas:', err);
        label.textContent = origText;
        btn.style.pointerEvents = '';
        alert('Could not load screenshot library. Try Print / Save as PDF instead.');
    });
}

function doCapture(btn, label, origText) {
    var menu = document.getElementById('vizMenu');
    menu.style.display = 'none';

    // 1. Find content container (avoids body::before and fixed-position issues)
    var target = document.querySelector('.container')
        || document.querySelector('main')
        || document.querySelector('[role="main"]')
        || document.body;

    // 2. Inject override styles: force animated elements to their final visible state,
    //    disable all transitions/animations so html2canvas sees static content
    var overrideStyle = document.createElement('style');
    overrideStyle.id = 'html2canvas-capture-overrides';
    overrideStyle.textContent = [
        // Force all animated/transitioning content to be fully visible and static
        '*, *::before, *::after {',
        '  animation-play-state: paused !important;',
        '  animation-delay: 0s !important;',
        '  animation-duration: 0s !important;',
        '  transition-duration: 0s !important;',
        '}',
        // Common animation class patterns used by /visualize outputs
        '.ani, .animate-in, [class*="delay-"],',
        '.d1,.d2,.d3,.d4,.d5,.d6,.d7,.d8,.d9,.d10,',
        '[data-animate] {',
        '  opacity: 1 !important;',
        '  transform: none !important;',
        '  filter: none !important;',
        '}',
        // Keep the menu panel hidden during capture
        '.viz-menu-panel { opacity: 0 !important; pointer-events: none !important; }',
    ].join('\n');
    document.head.appendChild(overrideStyle);

    // 3. Give the target a solid background (body::before gradients won't be captured)
    var origBg = target.style.background;
    if (target !== document.body) {
        target.style.background = getComputedStyle(document.body).backgroundColor || '#ffffff';
    }

    // 4. Scroll to top
    var scrollPos = window.scrollY;
    window.scrollTo(0, 0);

    // 5. Wait for fonts to load, then capture
    var capture = function() {
        // Force layout recalc after style overrides
        void target.offsetHeight;

        // Patch window.getComputedStyle to convert CSS color() values to rgba().
        // html2canvas 1.4.1 can't parse color() — Chrome 111+ uses it in
        // computed styles. html2canvas uses the MAIN window's getComputedStyle
        // (not the cloned iframe's), so we must patch it here.
        // Restored in .finally() below.
        var origGCS = window.getComputedStyle;
        if (typeof Proxy !== 'undefined') {
            var cvs = document.createElement('canvas');
            cvs.width = cvs.height = 1;
            var ctx = cvs.getContext('2d');
            function fixColor(val) {
                if (typeof val !== 'string' || val.indexOf('color(') === -1) return val;
                ctx.clearRect(0, 0, 1, 1);
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fillStyle = val;
                ctx.fillRect(0, 0, 1, 1);
                var d = ctx.getImageData(0, 0, 1, 1).data;
                return 'rgba(' + d[0] + ',' + d[1] + ',' + d[2] + ',' + (d[3] / 255).toFixed(3) + ')';
            }
            window.getComputedStyle = function(el, pseudo) {
                var style = origGCS.call(this, el, pseudo);
                return new Proxy(style, {
                    get: function(target, prop) {
                        if (prop === 'getPropertyValue') {
                            return function(name) { return fixColor(target.getPropertyValue(name)); };
                        }
                        var v = target[prop];
                        if (typeof v === 'function') return v.bind(target);
                        return fixColor(v);
                    }
                });
            };
        }

        html2canvas(target, {
            scale: 2,
            useCORS: true,
            allowTaint: false,
            logging: false,
            onclone: function(clonedDoc) {
                // In the cloned document, ensure all elements are visible
                var els = clonedDoc.querySelectorAll('.ani, .animate-in, [class*="delay-"], [data-animate]');
                for (var i = 0; i < els.length; i++) {
                    els[i].style.opacity = '1';
                    els[i].style.transform = 'none';
                    els[i].style.filter = 'none';
                }
            }
        }).then(function(canvas) {
            var filename = (document.title || 'visualization') + '.png';
            // Use toBlob + createObjectURL instead of toDataURL to avoid:
            // - Data URL size limits (~2MB in Chrome)
            // - Silent failures with <a download>.click() in sandboxed iframes
            canvas.toBlob(function(blob) {
                if (!blob) {
                    alert('Screenshot failed. Try Print / Save as PDF instead.');
                    return;
                }
                var url = URL.createObjectURL(blob);
                var link = document.createElement('a');
                link.download = filename;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                // Revoke after a short delay to ensure download starts
                setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
            }, 'image/png');
        }).catch(function(err) {
            console.error('Screenshot failed:', err);
            alert('Screenshot failed. Try Print / Save as PDF instead.');
        }).finally(function() {
            // Restore everything
            window.getComputedStyle = origGCS;
            overrideStyle.remove();
            target.style.background = origBg;
            menu.style.display = '';
            label.textContent = origText;
            btn.style.pointerEvents = '';
            menu.classList.remove('open');
            window.scrollTo(0, scrollPos);
        });
    };

    // Use Font Loading API if available, otherwise fall back to timeout
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
            setTimeout(capture, 50);
        });
    } else {
        setTimeout(capture, 500);
    }
}
</script>
